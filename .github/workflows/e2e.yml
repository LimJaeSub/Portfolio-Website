name: E2E

on:
  push:
    branches: [main]
    # 결과 파일 커밋이 이 워크플로를 다시 트리거하지 않도록 제외한다.
    # concurrency + [skip ci]와 함께 3중으로 막는다 — 루프는 한 번 돌기 시작하면 비싸다
    paths-ignore:
      - 'public/test-results.json'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# 결과 파일을 되커밋해야 하므로 쓰기 권한이 필요하다.
# 레포 기본값이 읽기 전용이면 push 단계에서 403이 난다
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # 브라우저 바이너리는 node_modules에 없다. 매번 따로 받아야 한다
      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      # playwright.config.js의 webServer가 build + preview를 알아서 띄운다
      - run: npx playwright test
        env:
          CI: true

      # 실패해도 결과를 남긴다 — 통과했을 때만 갱신하면 사이트가 거짓말을 한다
      - name: 결과 요약
        if: always()
        run: node scripts/summarize-tests.js

      - name: 요약 결과 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: public/test-results.json
          retention-days: 30

      - name: 결과를 레포에 커밋
        # PR에서는 커밋하지 않는다. main에 올라간 것만 사이트에 반영한다
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/test-results.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 테스트 결과 갱신 [skip ci]"
          git push
